name: family-review-recheck
# ق٦٥: Codex قد يأتي بحكمه النظيف تعليقًا بعد انتهاء انتظار family-review. تعليقُ مهمّةٍ من حدث issue_comment لا يُعلَّق
# على رأس الطلب، فيُعاد تشغيلُ آخر تشغيلٍ لـfamily-review على الرأس بدل ذلك. لا يسحب شيفرةَ الطلب ولا يقرأ سرًّا.
on:
  issue_comment:
    types: [created, edited]

permissions:
  actions: write
  pull-requests: read

jobs:
  recheck:
    if: github.event.issue.pull_request && github.event.comment.user.login == 'chatgpt-codex-connector[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Re-run the latest family-review on the current head
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.issue.number }}
        run: |
          head=$(gh api "repos/$REPO/pulls/$PR" --jq .head.sha)
          run=$(gh api "repos/$REPO/actions/workflows/family-review.yml/runs?head_sha=$head&per_page=1" --jq '.workflow_runs[0].id // empty')
          if [ -z "$run" ]; then echo "no family-review run on $head"; exit 0; fi
          gh run rerun "$run" --repo "$REPO" || echo "run $run is still in progress; its own wait will read the comment"
