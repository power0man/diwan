name: family-review-recheck
# ق٦٥: Codex قد يأتي بحكمه النظيف تعليقًا بعد انتهاء انتظار family-review. تعليقُ مهمّةٍ من حدث issue_comment لا يُعلَّق
# على رأس الطلب، فيُعاد تشغيلُ آخر تشغيلٍ لـfamily-review على الرأس بدل ذلك. لا يسحب شيفرةَ الطلب ولا يقرأ سرًّا.
on:
  issue_comment:
    # deleted: حذفُ التعليق المحتسب يُعيد الفحص فيسحب نجاحًا لم يعد له سند.
    types: [created, edited, deleted]

permissions:
  actions: write
  pull-requests: read

# ملخّصُ Codex يُحرَّر مع كل تغيّر حالة؛ فالحدثُ الأخير لكل طلب هو الذي يُعيد الفحص.
concurrency:
  group: family-review-recheck-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  recheck:
    if: github.event.issue.pull_request && github.event.comment.user.login == 'chatgpt-codex-connector[bot]'
    runs-on: ubuntu-latest
    # أطولُ من مهلة family-review (٢٠ دقيقة)، لأن الإعادة تنتظر انتهاءَ تشغيله الجاري.
    timeout-minutes: 25
    steps:
      - name: Re-run the latest family-review on the current head
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.issue.number }}
        run: |
          head=$(gh api "repos/$REPO/pulls/$PR" --jq .head.sha)
          run=$(gh api "repos/$REPO/actions/workflows/family-review.yml/runs?head_sha=$head&per_page=1" --jq '.workflow_runs[0].id // empty')
          if [ -z "$run" ]; then echo "no family-review run on $head"; exit 0; fi
          # تشغيلٌ جارٍ قد يكون أجرى جلبه الأخير قبل التعليق، ولا يُعاد تشغيلُ ما لم ينتهِ: فيُنتظر ثم يُعاد.
          # وإخفاقُ الإعادة إخفاقٌ لهذه المهمّة، لا يُبلَع.
          until [ "$(gh api "repos/$REPO/actions/runs/$run" --jq .status)" = completed ]; do sleep 20; done
          gh run rerun "$run" --repo "$REPO"
