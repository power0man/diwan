name: mutation-check
# فاحصُ الطفرات (ق٦٧-٦): «قُتلت الطفرة» يُثبَت بالآلة. على كلِّ طلبٍ تُطبَّق بياناتُ الطفرات التي تغيّرت في مداه
# (tests/mutations/*.jsonl) في شجرة عملٍ منفصلة، ويُرفض اختبارٌ مسّه الطلب لا يسمّيه بيانٌ بمعرّفه الكامل. وأسبوعيًّا تُطبَّق البياناتُ كلُّها.
# بلا أسرار وبصلاحية قراءةٍ وحدها، على المشغّل المستضاف نفسِه الذي يشغّل verify-hosted.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:
    inputs:
      scope:
        description: "changed (بياناتُ المدى) أو all (كلُّ البيانات)"
        type: choice
        options: [changed, all]
        default: changed

permissions:
  contents: read

concurrency:
  group: mutation-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mutation-check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install the locked runtime
        run: |
          set -eu
          python3 -m pip install --user 'uv==0.8.17'
          "$HOME/.local/bin/uv" python install 3.14
          "$HOME/.local/bin/uv" sync --frozen --python 3.14 --extra dev
      - name: Apply the mutations of this range (or all of them)
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCOPE: ${{ github.event.inputs.scope || 'changed' }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -eu
          report="$RUNNER_TEMP/mutation-check.json"
          if [ "$EVENT_NAME" = "pull_request" ] && [ "$SCOPE" = "changed" ]; then
            .venv/bin/python tools/mutation_check.py --range "$BASE..$HEAD" --head "$HEAD" --report "$report"
          else
            .venv/bin/python tools/mutation_check.py --all --head "$HEAD" --report "$report"
          fi
