name: gemini-review
# ك٥٤: مراجِعُ Gemini الاستشاريّ بمفتاح المستودع (سرُّ GEMINI_API_KEY يضعه المالك). ينشر مراجعةً بحالة COMMENT يقرؤها المالك،
# ولا يحتسبها فحصُ family-review لأنها باسم github-actions[bot]. يعمل على فروع المستودع نفسه وحدها، لا على المسوّدات،
# ولا يسحب شيفرةَ طلبٍ منسوخ؛ والفرقُ يُقرأ من واجهة GitHub نصًّا ولا يُنفَّذ.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      pr:
        description: رقمُ طلب الدمج
        required: true
        type: number

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: gemini-review-${{ github.event.pull_request.number || inputs.pr }}
  cancel-in-progress: true

jobs:
  gemini-review:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.head.repo.full_name == github.repository && !github.event.pull_request.draft)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Gemini reviews the current head through its API (advisory)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          PR_EVENT: ${{ github.event.pull_request.number }}
          BASE_EVENT: ${{ github.event.pull_request.base.sha }}
          HEAD_EVENT: ${{ github.event.pull_request.head.sha }}
          PR_INPUT: ${{ inputs.pr }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then
            PR="$PR_INPUT"
            BASE=$(gh api "repos/$REPO/pulls/$PR" --jq .base.sha)
            HEAD=$(gh api "repos/$REPO/pulls/$PR" --jq .head.sha)
            git fetch --no-tags origin "pull/$PR/head"
          else
            PR="$PR_EVENT"; BASE="$BASE_EVENT"; HEAD="$HEAD_EVENT"
          fi
          python3 tools/gemini_review.py --range "$BASE..$HEAD" --head "$HEAD" --pr "$PR" --repo-slug "$REPO"
