name: container-smoke
# ج٦ (#36): التثبيتُ بأمرٍ واحد (`docker build`) وفحصُ الدخان داخل الحاوية على المشغّل المستضاف.
# الحاويةُ بلا شبكة (`--network none`): فالمحرّكُ غائبٌ يقينًا، والمتونُ ليست في النسخة العامة.
# المتوقَّع: الخروج 3 (تعذّرٌ معلن) وكلُّ خطوةٍ بحالها المسمّاة، ولا خطوةَ «failed».
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  container-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: One-command install
        run: docker build -t diwan:ci .
      - name: Smoke check inside the container, offline
        run: |
          set +e
          docker run --rm --network none diwan:ci diwan check --json > smoke.json
          code=$?
          set -e
          cat smoke.json
          python3 - "$code" <<'PY'
          import json, sys
          report = json.load(open("smoke.json", encoding="utf-8"))
          got = {s["step"]: (s["status"], s["code"]) for s in report["steps"]}
          want = {"runtime": ("ok", None), "morphology": ("ok", "camel_ready"),
                  "engine": ("unavailable", "engine_unreachable"), "agent_turn": ("ok", "mechanism_only"),
                  "policies": ("unavailable", "corpus_missing"), "ui": ("ok", "ui_ready")}
          bad = {k: (got.get(k), v) for k, v in want.items()
                 if got.get(k) is None or got[k][0] != v[0] or (v[1] and got[k][1] != v[1])}
          assert int(sys.argv[1]) == 3 == report["exit_code"], f"exit {sys.argv[1]} / {report['exit_code']}"
          assert not bad, f"steps differ: {bad}"
          print("container smoke: exit 3 with every step as declared")
          PY
      - name: Python 3.12 tests in the image
        run: |
          docker run --rm --network none --mount "type=bind,src=$PWD/.git,dst=/app/.git,readonly" \
            diwan:ci python -m pytest -p no:cacheprovider
      - name: Conversation survives container replacement
        run: |
          set -eu
          volume="diwan-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          docker volume create "$volume"
          trap 'docker volume rm "$volume"' EXIT
          docker run --rm --network none --mount "type=volume,src=$volume,dst=/app/var" diwan:ci python ci/container_state.py write
          docker run --rm --network none --mount "type=volume,src=$volume,dst=/app/var" diwan:ci python ci/container_state.py read
      - name: Install a tool in a fresh isolated environment, outside the checkout
        run: |
          docker run --rm diwan:ci sh -eu -c '
            uv export --frozen --extra dev --no-emit-project -o /tmp/locked.txt >/dev/null
            UV_TOOL_DIR=/tmp/tools UV_TOOL_BIN_DIR=/tmp/bin uv tool install \
              --with-requirements /tmp/locked.txt --find-links https://download.pytorch.org/whl/cpu/torch/ \
              --python /usr/local/bin/python3 /opt/diwan-wheel/*.whl
            cd /tmp
            /tmp/bin/diwan serve --help
            set +e
            /tmp/bin/diwan check --json > /tmp/installed-smoke.json
            code=$?
            set -e
            cat /tmp/installed-smoke.json
            test "$code" -eq 3
          '
