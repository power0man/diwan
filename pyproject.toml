[project]
name = "diwan"
version = "0.0.1"
description = "مساحة عمل شخصية: مشروعات ومصادر وتحرير وتقييم"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = ["cryptography==50.0.1"]

[project.optional-dependencies]
dev = ["pytest==9.1.1"]
# غ١/ق٥٥: CAMeL Tools للجذور، لازمٌ للإطلاق (فحصُ الدخان لا يُعلن الجهازَ جاهزًا بدونه وبدون
# `camel_data -i morphology-db-msa-r13`). يبقى هنا لا في الاعتماديات الرئيسة لأن torch من PyPI على لينكس
# يجرّ نحو ٣ غيغابايت من حزم CUDA؛ نقلُه بفهرس torch للمعالج مهمّةُ ك٣٣.
morphology = ["camel-tools>=1.6"]
mlx = [
    "mlx>=0.32.0",
    "mlx-lm>=0.31.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
